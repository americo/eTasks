<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>eTasks - Administração</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="../static/css/main.css">
</head>

<body class="bg-light">
	<div class="container">
		<div class="row justify-content-center align-items-center min-vh-100">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow-lg border-0 animate-fade-in">
					<div class="card-body p-5">
						<div class="text-center mb-4">
							<h1 class="h3 mb-3 fw-normal">Administração</h1>
							<p class="text-muted">Faça login para acessar o painel administrativo</p>
						</div>

						<form id="loginForm" onsubmit="return false;">
							<div class="mb-3">
								<label class="form-label">Usuário</label>
								<div class="input-group">
									<span class="input-group-text bg-light">
										<i class="fas fa-user"></i>
									</span>
									<input type="text" class="form-control" id="username" name="username"
										placeholder="Digite seu usuário" required>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label">Palavra-passe</label>
								<div class="input-group">
									<span class="input-group-text bg-light">
										<i class="fas fa-lock"></i>
									</span>
									<input type="password" class="form-control" id="password" name="password"
										placeholder="Digite sua palavra-passe" required>
								</div>
							</div>

							<div class="d-grid gap-2">
								<button type="submit" class="btn btn-primary" onclick="doLogin()">
									<i class="fas fa-sign-in-alt me-2"></i>Entrar
								</button>
							</div>

							<div id="loginMessage" class="alert mt-3 d-none"></div>
						</form>

						<div class="text-center mt-4">
							<a href="/admin/forgotPassword" class="text-decoration-none me-3">
								<i class="fas fa-key me-1"></i>Esqueci a palavra-passe
							</a>
							<a href="/admin/dashboard" class="text-decoration-none">
								<i class="fas fa-tachometer-alt me-1"></i>Ir para o painel
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script>
		function doLogin() {
			var username = $("#username").val();
			var password = $("#password").val();

			if (!username || !password) {
				showMessage("Por favor, preencha todos os campos!", "danger");
				return;
			}

			var data = "<user><username>" + username + "</username><password>" + password + "</password></user>";

			$.ajax({
				type: "POST",
				url: "doLogin",
				contentType: "application/xml;charset=utf-8",
				data: data,
				dataType: "xml",
				success: function (result) {
					var code = result.getElementsByTagName("code")[0].childNodes[0].nodeValue;
					var msg = result.getElementsByTagName("msg")[0].childNodes[0].nodeValue;

					if (code == "0") {
						showMessage("Palavra-passe incorreta para " + msg + "!", "danger");
					} else if (code == "1") {
						showMessage(msg + " logado com sucesso!", "success");
						setTimeout(function () {
							window.location.href = "/admin/dashboard";
						}, 1500);
					} else {
						showMessage("Erro: " + msg, "danger");
					}
				},
				error: function (XMLHttpRequest, textStatus, errorThrown) {
					showMessage("Erro: " + errorThrown + " - " + textStatus, "danger");
				}
			});
		}

		function showMessage(message, type) {
			var alertDiv = $("#loginMessage");
			alertDiv.removeClass("d-none alert-success alert-danger")
				.addClass("alert-" + type)
				.html('<i class="fas ' + (type === "success" ? "fa-check-circle" : "fa-exclamation-circle") + ' me-2"></i>' + message);
		}
	</script>
</body>

</html>
