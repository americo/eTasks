<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eTasks - Entrar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="../static/css/main.css">
</head>

<body class="bg-light">
  <div class="container">
    <div class="row justify-content-center min-vh-100 align-items-center">
      <div class="col-12 col-md-8 col-lg-6">
        {% if login_failed %}
        <div class="alert alert-danger alert-dismissible fade show animate-fade-in" role="alert">
          <i class="fas fa-exclamation-circle me-2"></i>
          Código OTP incorreto!
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <div class="card shadow-lg border-0 animate-fade-in">
          <div class="card-body p-5">
            <div class="text-center mb-4">
              <h1 class="display-6 fw-bold text-primary mb-2">
                <i class="fas fa-tasks me-2"></i>eTasks
              </h1>
              <p class="text-muted">O seu gerenciador de tarefas!</p>
            </div>

            <form method="POST" action="/login2">
              <div class="mb-4">
                <label class="form-label">Código OTP</label>
                <div class="input-group">
                  <span class="input-group-text bg-light">
                    <i class="fas fa-key"></i>
                  </span>
                  <input type="number" class="form-control" name="otp_code" placeholder="Digite o código de 4 dígitos"
                    required>
                </div>
              </div>

              <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                  <i class="fas fa-check me-2"></i>Confirmar
                </button>
              </div>

              <div class="text-center mt-4">
                <p class="text-muted">
                  <a href="#" onclick="alert('O seu código OTP é {{ otp_code }}')" class="text-decoration-none">
                    <i class="fas fa-eye me-1"></i>Visualizar OTP
                  </a>
                </p>
              </div>
            </form>
          </div>
        </div>

        <div class="text-center mt-4">
          <div class="social-links mb-3">
            <a href="#" class="text-muted me-3"><i class="fab fa-twitter fa-lg"></i></a>
            <a href="#" class="text-muted me-3"><i class="fab fa-facebook fa-lg"></i></a>
            <a href="#" class="text-muted me-3"><i class="fab fa-instagram fa-lg"></i></a>
            <a href="#" class="text-muted me-3"><i class="fab fa-github fa-lg"></i></a>
            <a href="#" class="text-muted"><i class="fas fa-envelope fa-lg"></i></a>
          </div>
          <p class="text-muted small">
            &copy; eTasks. Todos direitos reservados. Desenvolvido por
            <a href="https://americojunior.com" class="text-decoration-none">Américo Júnior</a> e
            Mantido por <a href="https://thebughunter.io" class="text-decoration-none">The Bug Hunter</a>
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
