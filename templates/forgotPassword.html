<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>eTasks - Recuperar Palavra-passe</title>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="../static/css/main.css">
</head>

<body class="bg-light">
	<div class="container">
		<div class="row justify-content-center align-items-center min-vh-100">
			<div class="col-md-6 col-lg-5">
				<div class="card shadow-lg border-0 animate-fade-in">
					<div class="card-body p-5">
						<div class="text-center mb-4">
							<h1 class="h3 mb-3 fw-normal">Recuperar Palavra-passe</h1>
							<p class="text-muted">Digite seu e-mail para receber as instruções de recuperação</p>
						</div>

						<form id="forgotPasswordForm" onsubmit="return false;">
							<div class="mb-4">
								<label class="form-label">E-mail</label>
								<div class="input-group">
									<span class="input-group-text bg-light">
										<i class="fas fa-envelope"></i>
									</span>
									<input type="email" class="form-control" id="email" name="email"
										placeholder="Digite seu e-mail" required>
								</div>
							</div>

							<div class="d-grid gap-2">
								<button type="submit" class="btn btn-primary" onclick="doForgotPassword()">
									<i class="fas fa-paper-plane me-2"></i>Enviar Instruções
								</button>
							</div>

							<div id="forgotPasswordMessage" class="alert mt-3 d-none"></div>
						</form>

						<div class="text-center mt-4">
							<a href="/admin" class="text-decoration-none">
								<i class="fas fa-arrow-left me-1"></i>Voltar para o login
							</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
	<script>
		function doForgotPassword() {
			var email = $("#email").val();

			if (!email) {
				showMessage("Por favor, digite seu e-mail!", "danger");
				return;
			}

			var data = "<user><email>" + email + "</email></user>";

			$.ajax({
				type: "POST",
				url: "doForgotPassword",
				contentType: "application/xml;charset=utf-8",
				data: data,
				dataType: "xml",
				success: function (result) {
					var code = result.getElementsByTagName("code")[0].childNodes[0].nodeValue;
					var msg = result.getElementsByTagName("msg")[0].childNodes[0].nodeValue;

					if (code == "0") {
						showMessage(msg, "danger");
					} else if (code == "1") {
						showMessage(msg, "success");
						setTimeout(function () {
							window.location.href = "/admin";
						}, 2000);
					} else {
						showMessage("Erro: " + msg, "danger");
					}
				},
				error: function (XMLHttpRequest, textStatus, errorThrown) {
					showMessage("Erro: " + errorThrown + " - " + textStatus, "danger");
				}
			});
		}

		function showMessage(message, type) {
			var alertDiv = $("#forgotPasswordMessage");
			alertDiv.removeClass("d-none alert-success alert-danger")
				.addClass("alert-" + type)
				.html('<i class="fas ' + (type === "success" ? "fa-check-circle" : "fa-exclamation-circle") + ' me-2"></i>' + message);
		}
	</script>
</body>

</html>
